      <div class="in-card" id="in-idle">

      <div class="in-card" id="in-live">
        <i class="ld" id="in-ld"></i><div class="st">Recording<span id="in-clock">0:00</span></div>

      <path d="M1 1 L1 21.5 L6.2 16.6 L9.6 24.6 L13 23.1 L9.7 15.3 L16.6 15.3 Z" fill="#0f172a" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" />
    </svg>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const clock = document.querySelector("#in-clock");
      const LIVE = 4.6; // the card turns live; its timer counts from here

      tl.set("#in-cursor", { x: 1180, y: 1120 }, 0);

      // the idea, alone and readable from frame 0; its light blinks
      tl.to("#in-rec-dot", { opacity: 0.15, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.5);
      tl.to("#in-title", { opacity: 0, y: -18, filter: "blur(6px)", duration: 0.6, ease: "power2.in" }, 2.2);

      // the side panel settles in
      tl.fromTo("#in-shot", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 2.75);

      // the cursor glides to Start recording and clicks
      tl.to("#in-cursor", { x: 950, y: 561, duration: 1.3, ease: "power2.inOut" }, 2.9);
      const click = 4.4;
      tl.to("#in-cursor", { scale: 0.88, duration: 0.08, ease: "power2.in", transformOrigin: "2px 2px" }, click - 0.08);
      tl.to("#in-cursor", { scale: 1, duration: 0.18, ease: "power2.out" }, click);
      tl.to("#in-rec", { scale: 0.97, duration: 0.08, ease: "power2.in" }, click - 0.08);
      tl.to("#in-rec", { scale: 1, duration: 0.18, ease: "power2.out" }, click);

      // the card turns live: same place, a soft crossfade; the next scene pulls back from here
      tl.to("#in-idle", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, click + 0.1);
      tl.fromTo("#in-live", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, LIVE - 0.1);
      tl.to("#in-cursor", { x: 1180, y: 1120, opacity: 0, duration: 1.0, ease: "power2.in" }, click + 0.5);
      tl.set({}, {}, 5.6);

      tl.eventCallback("onUpdate", () => {
        clock.textContent = "0:0" + Math.max(0, Math.min(3, Math.floor(tl.time() - LIVE)));
      });
      // the whole scene plays 1.1x: authored at a calm pace, then sped up a touch (SPEED in every scene)
      const SPEED = 1.1;
      const film = gsap.timeline({ paused: true });
      film.add(tl.paused(false).timeScale(SPEED), 0);
      window.__timelines["intro"] = film;
    })();
  </script>
