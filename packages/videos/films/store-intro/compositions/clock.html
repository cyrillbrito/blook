  <script>
    (function () {
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const X = (t) => 480 + (t - 11.5) * 480;
      const ck = { t: 11.5 };
      const clamp01 = gsap.utils.clamp(0, 1);
      const mix = (a, b, k) => gsap.utils.interpolate(a, b, k);
      const LIT = {
        speech: { tick: "#93c5fd", pillBg: "#dbeafe", pill: "#1e40af", row: "#0f172a" },
        click: { tick: "#0ea5e9", pillBg: "#e0f2fe", pill: "#075985", row: "#0f172a" },
        failed: { tick: "#f97316", pillBg: "#fee2e2", pill: "#991b1b", row: "#b91c1c" },
        error: { tick: "#dc2626", pillBg: "#fee2e2", pill: "#991b1b", row: "#b91c1c" },
      };
      const DIM = { tick: "#cbd5e1", pillBg: "#f1f5f9", pill: "#768599", row: "#7c8aa0" };
      const evs = $$(".ev").map((e) => ({ t: parseFloat(e.dataset.t), c: LIT[e.dataset.kind], tick: e.querySelector(".tick"), pill: e.querySelector(".pill"), row: e.querySelector(".row") }));
      const ph = $("#ck-ph"), time = $("#ck-time");
      function draw() {
        const t = ck.t;
        ph.style.transform = "translateX(" + X(t).toFixed(1) + "px)";
        time.textContent = "0:" + t.toFixed(1);
        for (const e of evs) {
          const k = clamp01((t - e.t) / 0.05 + 1);
          e.tick.style.background = mix(DIM.tick, e.c.tick, k);
          e.pill.style.background = mix(DIM.pillBg, e.c.pillBg, k);
          e.pill.style.color = mix(DIM.pill, e.c.pill, k);
          e.row.style.color = mix(DIM.row, e.c.row, k);
        }
      }
      tl.eventCallback("onUpdate", draw);
      tl.set("#ck-line", { scaleY: 0 }, 0);

      // title alone, then the shot

      tl.fromTo(["#ck-knob", "#ck-time"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.8);

      // a slow sweep to 0:13.0, where the click, the 404 and the error line up

      // a gentle push-in centred on the events (x 646..1814), so they read on a phone; the lane labels slide off
      tl.to("#ck-zoom", { scale: 1.2, x: -270, transformOrigin: "1230px 540px", duration: 1.6, ease: "power2.inOut" }, S + SD + 0.3);

      // say what lines up: the error is found, at the click
      tl.fromTo("#ck-call", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, S + SD + 1.9);

      // out
      tl.to("#ck-shot", { opacity: 0, y: -18, duration: 0.6, ease: "power2.in" }, 11.9);
      tl.set({}, {}, 12.6);

      draw();
      // the whole scene plays 1.1x: authored at a calm pace, then sped up a touch (SPEED in every scene)
      const SPEED = 1.1;
      const film = gsap.timeline({ paused: true });
      film.add(tl.paused(false).timeScale(SPEED), 0);
      window.__timelines["clock"] = film;
    })();
