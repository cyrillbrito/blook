  <script>
    (function () {
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const X = (t) => 190 + ((t - 10) / 6) * 1000;
      const ck = { t: 12.95 };
      const head = $("#pg-head"), fill = $("#pg-fill"), time = $("#pg-time");
      const tag = $("#pg-tag"), chk = $("#pg-chk"), tg = $("#pg-tg"), tx = $("#pg-tx"), strike = $("#pg-strike");
      function draw() {
        const t = ck.t;
        head.style.transform = "translateX(" + X(t).toFixed(1) + "px)";
        fill.style.transform = "scaleX(" + ((t - 10) / 6).toFixed(4) + ")";
        time.textContent = "0:" + t.toFixed(1);
        const done = t >= 12.9;
        tag.textContent = done ? '<li class="completed">' : "<li>";
        chk.style.opacity = done ? "1" : "0";
        tg.style.opacity = done ? "0" : "1";
        tx.style.color = done ? "#949494" : "#484848";
        strike.style.transform = "scaleX(" + (done ? 1 : 0) + ")";
      }
      tl.eventCallback("onUpdate", draw);

      // title alone, then the shot
      tl.fromTo("#pg-title", { opacity: 0, y: 28, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0.15);
      tl.to("#pg-title", { opacity: 0, y: -18, filter: "blur(6px)", duration: 0.6, ease: "power2.in" }, 2.6);
      tl.fromTo("#pg-shot", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 3.15);

      // scrub back before the click, then forward past it: the class comes and goes
      tl.to(ck, { t: 12.4, duration: 1.2, ease: "power2.inOut" }, 4.3);
      tl.to(ck, { t: 13.3, duration: 1.4, ease: "power2.inOut" }, 6.2);
      tl.to(ck, { t: 12.95, duration: 0.8, ease: "power2.inOut" }, 8.0);

      // out
      tl.to("#pg-shot", { opacity: 0, y: -18, duration: 0.6, ease: "power2.in" }, 9.4);
      tl.set({}, {}, 10.1);

      draw();
      // the whole scene plays 1.1x: authored at a calm pace, then sped up a touch (SPEED in every scene)
      const SPEED = 1.1;
      const film = gsap.timeline({ paused: true });
      film.add(tl.paused(false).timeScale(SPEED), 0);
      window.__timelines["page"] = film;
    })();
