  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const tiles = Array.from(document.querySelectorAll(".zp-tile"));
      const teeth = Array.from(document.querySelectorAll("#zp-teeth rect"));
      const ZIP = { x: 960, y: 357 }; // the ZIP's centre

      // the downloaded ZIP and its name are already here (the record scene left them); say what it is
      tl.fromTo("#zp-line", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.3);

      // it unzips, and what a recording holds comes out of it, one tile at a time
      const U = 2.6;
      tl.to(["#zp-line", "#zp-name"], { opacity: 0, y: -14, duration: 0.5, ease: "power2.in" }, U);
      tl.to("#zp-pull", { y: -112, duration: 0.7, ease: "power2.inOut" }, U + 0.2);
      tl.to(teeth.slice().reverse(), { opacity: 0, duration: 0.15, stagger: 0.06 }, U + 0.2);
      tl.to("#zp-zip", { opacity: 0, scale: 0.9, transformOrigin: "50% 50%", duration: 0.6, ease: "power2.in" }, U + 0.9);
      tiles.forEach((el, k) => {
        const r = { x: parseFloat(el.style.left) + 250, y: parseFloat(el.style.top) + 100 };
        tl.fromTo(
          el,
          { opacity: 0, x: ZIP.x - r.x, y: ZIP.y - r.y, scale: 0.15 },
          { opacity: 1, x: 0, y: 0, scale: 1, duration: 1.0, ease: "power3.out" },
          U + 0.9 + k * 0.18,
        );
      });

      // out
      tl.to(tiles, { opacity: 0, y: -18, duration: 0.6, ease: "power2.in" }, 7.2);
      tl.set({}, {}, 7.9);
      // the whole scene plays 1.1x: authored at a calm pace, then sped up a touch (SPEED in every scene)
      const SPEED = 1.1;
      const film = gsap.timeline({ paused: true });
      film.add(tl.paused(false).timeScale(SPEED), 0);
      window.__timelines["zip"] = film;
    })();
