<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>#launch · Lumen Studio</title>
    <style>
      :root {
        --side: #17322b;
        --side-2: #22453c;
        --side-text: #a9c2b9;
        --paper: #ffffff;
        --line: #e6e9e8;
        --text: #1b2421;
        --muted: #6b7773;
        --accent: #2f6f5e;
        --hover: #f5f7f6;
        --bad: #c0392b;
        font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
        background: var(--paper);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 248px 1fr;
      }
      button,
      input {
        font: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      aside {
        background: var(--side);
        color: var(--side-text);
        padding: 16px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 15px;
      }
      .ws {
        color: #fff;
        font-weight: 600;
        font-size: 17px;
        padding: 4px 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ws i {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #d9f0e6;
        color: var(--side);
        display: grid;
        place-items: center;
        font-style: normal;
        font-size: 15px;
      }
      aside h2 {
        font-size: 13px;
        font-weight: 500;
        margin: 14px 10px 4px;
        color: #7f9d93;
      }
      aside a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 7px;
        color: inherit;
        text-decoration: none;
      }
      aside a.on {
        background: var(--side-2);
        color: #fff;
      }
      aside a.unread {
        color: #fff;
        font-weight: 600;
      }
      aside a .n {
        margin-left: auto;
        background: #e9775a;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        border-radius: 99px;
        padding: 0 7px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1.5px solid #7f9d93;
      }
      .dot.on {
        background: #4cc38a;
        border-color: #4cc38a;
      }
      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 600;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .faces {
        margin-left: auto;
        display: flex;
      }
      .faces .av {
        width: 28px;
        height: 28px;
        font-size: 11px;
        border: 2px solid #fff;
        margin-left: -6px;
      }
      #list {
        overflow-y: auto;
        padding: 12px 0;
      }
      .day {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin: 6px 0 10px;
      }
      .msg {
        display: grid;
        grid-template-columns: 40px 1fr;
        gap: 12px;
        padding: 8px 24px;
      }
      .msg:hover {
        background: var(--hover);
      }
      .av {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 14px;
      }
      .who {
        font-weight: 600;
        font-size: 15px;
      }
      .who time {
        font-weight: 400;
        color: var(--muted);
        font-size: 13px;
        margin-left: 6px;
      }
      .body {
        font-size: 15px;
        line-height: 1.5;
        margin-top: 2px;
      }
      .msg.pending .body {
        color: var(--muted);
      }
      .typing {
        height: 22px;
        padding: 0 24px;
        color: var(--muted);
        font-size: 13px;
      }
      form {
        padding: 0 24px 22px;
      }
      .box {
        border: 1px solid #cfd6d3;
        border-radius: 12px;
        display: flex;
        align-items: center;
        padding: 6px 6px 6px 16px;
        gap: 8px;
      }
      .box:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px #2f6f5e1f;
      }
      .box input {
        flex: 1;
        border: 0;
        outline: 0;
        font-size: 15px;
        padding: 8px 0;
      }
      .box button {
        border: 0;
        background: var(--accent);
        color: #fff;
        border-radius: 8px;
        height: 36px;
        padding: 0 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="ws"><i>L</i><span id="ws">Lumen Studio</span></div>
      <h2>Channels</h2>
      <nav id="channels"></nav>
      <h2>Direct messages</h2>
      <nav id="dms"></nav>
    </aside>
    <main>
      <header>
        <h1># launch</h1>
        <p>Shipping v2.4 on Thursday</p>
        <div class="faces" id="faces"></div>
      </header>
      <div id="list" aria-live="polite"></div>
      <div>
        <div class="typing" id="typing"></div>
        <form id="form">
          <div class="box">
            <input id="input" placeholder="Message #launch" autocomplete="off" aria-label="Message #launch" />
            <button>Send</button>
          </div>
        </form>
      </div>
    </main>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const channel = 'launch';
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

      const api = async (path, init) => {
        const res = await fetch(path, init);
        const body = await res.json().catch(() => null);
        if (!res.ok) throw Object.assign(new Error(body?.message ?? `HTTP ${res.status}`), { status: res.status });
        return body;
      };

      const [me, people, channels] = await Promise.all([api('/api/me'), api('/api/people'), api('/api/channels')]);
      let messages = await api(`/api/channels/${channel}/messages`);
      let online = [];

      $('channels').innerHTML = channels
        .map(
          (c) =>
            `<a href="#" class="${c.id === channel ? 'on' : ''} ${c.unread ? 'unread' : ''}"># ${c.name}${c.unread ? `<span class="n">${c.unread}</span>` : ''}</a>`,
        )
        .join('');
      const renderPeople = () => {
        $('dms').innerHTML = Object.entries(people)
          .filter(([id]) => id !== 'you')
          .map(([id, p]) => `<a href="#"><span class="dot ${online.includes(id) ? 'on' : ''}"></span>${p.name}</a>`)
          .join('');
        $('faces').innerHTML = Object.values(people)
          .map((p) => `<span class="av" style="background:${p.color}">${p.initials}</span>`)
          .join('');
      };
      renderPeople();

      function render() {
        $('list').innerHTML =
          '<div class="day">Today</div>' +
          messages
            .map((m) => {
              const p = people[m.author];
              return `<div class="msg ${m.pending ? 'pending' : ''}"><span class="av" style="background:${p.color}">${p.initials}</span>
                <div><div class="who">${p.name}<time>${m.at}</time></div><div class="body">${esc(m.text)}</div></div></div>`;
            })
            .join('');
        $('list').scrollTop = $('list').scrollHeight;
      }
      render();

      const ws = new WebSocket(`ws://${location.host}/live`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'presence') {
          online = msg.online;
          renderPeople();
        }
        if (msg.type === 'typing') $('typing').textContent = `${people[msg.author].name} is typing…`;
        if (msg.type === 'message.created' && msg.message.channel === channel) {
          $('typing').textContent = '';
          messages = messages.filter((m) => !(m.pending && m.text === msg.message.text));
          messages.push(msg.message);
          render();
        }
        // The server's list wins, so a message that failed to save quietly disappears.
        if (msg.type === 'channel.sync' && msg.channel === channel) {
          messages = msg.messages;
          render();
        }
      };

      $('form').onsubmit = async (e) => {
        e.preventDefault();
        const text = $('input').value.trim();
        if (!text) return;
        $('input').value = '';
        // Optimistic: show it right away, before the server answers.
        messages.push({ id: `tmp-${Date.now()}`, author: 'you', text, at: new Date().toTimeString().slice(0, 5), pending: true });
        render();
        try {
          await api(`/api/channels/${channel}/messages`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          ws.send(JSON.stringify({ type: 'posted', channel }));
        } catch (err) {
          console.error(`Message not saved (${err.status}): ${err.message}`);
        }
      };
    </script>
  </body>
</html>
