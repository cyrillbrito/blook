# Manual release: bump the version, tag, build, and publish a GitHub Release.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Release notes in Markdown (one sentence, then 2 to 6 bullets). Empty lists the commits since the last release.
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history, for the commit list in the notes
      - uses: oven-sh/setup-bun@v2

      # One version for the product: the root package.json (the extension manifest and the CLI read it).
      - name: Bump version
        id: version
        run: |
          bun pm version ${{ inputs.bump }} --no-git-tag-version
          echo "v=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Install and check
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test

      # Versionless name (wxt.config.ts zip.artifactTemplate), so releases/latest/download/blook-chrome.zip always works (install.sh uses it).
      - name: Build extension
        run: bun run zip

      - name: Build CLI binaries
        working-directory: packages/cli
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64; do
            bun run build --target=bun-$t --outfile dist/blook-$t
          done

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ steps.version.outputs.v }}"
          git tag "v${{ steps.version.outputs.v }}"
          git push origin HEAD "v${{ steps.version.outputs.v }}"

      # Notes are a short changelog; install steps live in README.md.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          V=${{ steps.version.outputs.v }}
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
          else
            prev=$(git describe --tags --abbrev=0 "v$V^")
            git log --no-merges --format='- %s' "$prev..v$V^" > notes.md
          fi
          gh release create "v$V" --title "v$V" --notes-file notes.md \
            packages/extension/.output/blook-chrome.zip \
            packages/cli/dist/blook-darwin-arm64 packages/cli/dist/blook-darwin-x64 packages/cli/dist/blook-linux-x64
