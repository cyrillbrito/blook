# Manual release: bump the version, tag, build, and publish a GitHub Release.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      # Root package.json is the source of truth; WXT puts it in the manifest, cli/ follows it.
      - name: Bump version
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          V=$(jq -r .version package.json)
          jq --arg v "$V" '.version = $v' cli/package.json > cli/package.tmp && mv cli/package.tmp cli/package.json
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: |
          bun install --frozen-lockfile
          bun run compile
          bun run test
          bun run zip
          # Versionless name, so releases/latest/download/blook-chrome.zip always works (install.sh uses it).
          cp .output/blook-$(jq -r .version package.json)-chrome.zip .output/blook-chrome.zip

      - name: Build CLI binaries
        working-directory: cli
        run: |
          bun install --frozen-lockfile
          bun run compile
          bun run test
          for t in darwin-arm64 darwin-x64 linux-x64; do
            bun run build:bin --target=bun-$t --outfile dist/blook-$t
          done

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ steps.version.outputs.v }}"
          git tag "v${{ steps.version.outputs.v }}"
          git push origin HEAD "v${{ steps.version.outputs.v }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.version.outputs.v }}
          cat > notes.md <<NOTES
          ## Install

          macOS (arm64, x64) and Linux (x64). Installs the CLI and the extension folder, and offers the agent skill; re-run to update.

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/cyrillbrito/blook/main/install.sh | sh
          \`\`\`

          Then in Chrome: open \`chrome://extensions\`, turn on Developer mode, click **Load unpacked** and pick the \`~/Blook/extension\` folder (\`blook extension\` shows the steps). After an update, click the extension's reload icon.

          NOTES
          gh release create "v$V" --title "v$V" --generate-notes --notes-file notes.md \
            .output/blook-chrome.zip \
            cli/dist/blook-darwin-arm64 cli/dist/blook-darwin-x64 cli/dist/blook-linux-x64
